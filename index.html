<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>استعلام انتخابات نادي أسوان</title>
  <style>
    /* إزالة أي هوامش وجعل الصفحة تملأ الشاشة بالكامل */
    body, html { 
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
      background-color: #0f1523; 
    }
    
    /* تنسيق الفريم ليأخذ حجم الشاشة 100% */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none; 
      -webkit-overflow-scrolling: touch; 
    }
  </style>
</head>
<body>

  <!-- رابط Google Apps Script الجديد الخاص بك -->
  <iframe src="https://script.google.com/macros/s/AKfycbzSB7wOh3T8csr7-Wlj_a8kfNg3UYBX2YJo_HMUIGXUz-5fGX24f0cI3K4UQmgs7tr1JQ/exec"></iframe>

</body>
</html>
